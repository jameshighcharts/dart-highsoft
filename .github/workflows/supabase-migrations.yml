name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/supabase-migrations.mjs'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_MIGRATION_BASELINE: '0055_game_sessions'

    steps:
      - name: Validate deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::Missing SUPABASE_PROJECT_ID variable"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v4

      # Production already contains every exact legacy migration through
      # 0055_game_sessions. Full names matter because 0055_pause_matches was
      # committed later and must not inherit that baseline.
      - name: Deploy new migrations
        run: node scripts/supabase-migrations.mjs deploy

      - name: Verify production migration history
        run: node scripts/supabase-migrations.mjs verify --wait-ms=60000
