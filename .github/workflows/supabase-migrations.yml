name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

permissions:
  contents: read

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Validate deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::Missing SUPABASE_PROJECT_ID variable"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v4

      # Production already contains 0000-0055, but its migration history was
      # created outside the CLI and is empty. Migration 0055 was verified
      # against the live schema before advancing this deployment baseline.
      - name: Deploy new migrations
        env:
          SUPABASE_MIGRATION_BASELINE: '0055'
        run: |
          node <<'NODE'
          const { readdir, readFile } = require('node:fs/promises');
          const path = require('node:path');

          (async () => {
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const projectId = process.env.SUPABASE_PROJECT_ID;
          const baseline = process.env.SUPABASE_MIGRATION_BASELINE;
          const migrationsDir = path.join(process.cwd(), 'supabase', 'migrations');
          const endpoint = `https://api.supabase.com/v1/projects/${projectId}/database/migrations`;

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...options.headers,
              },
            });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`Supabase migration API failed (${response.status}): ${body}`);
            }
            return response.status === 204 ? null : response.json();
          }

          const files = (await readdir(migrationsDir))
            .filter((file) => /^\d+_.+\.sql$/.test(file))
            .sort();
          if (!files.some((file) => file.startsWith(`${baseline}_`))) {
            throw new Error(`Migration baseline ${baseline} is missing locally`);
          }

          const history = await request(endpoint);
          const applied = new Set(
            history.flatMap(({ version, name }) => [String(version || ''), String(name || '')])
          );
          const pending = files.filter((file) => {
            const name = path.basename(file, '.sql');
            const version = name.split('_', 1)[0];
            return version > baseline && !applied.has(version) && !applied.has(name);
          });

          for (const file of pending) {
            const name = path.basename(file, '.sql');
            const query = await readFile(path.join(migrationsDir, file), 'utf8');
            await request(endpoint, {
              method: 'POST',
              body: JSON.stringify({ name, query }),
            });
            console.log(`Applied ${file}`);
          }

          console.log(
            pending.length === 0
              ? `No migrations newer than baseline ${baseline} are pending`
              : `Applied ${pending.length} migration(s)`
          );
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
